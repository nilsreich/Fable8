<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!--
      viewport-fit=cover: safe-area insets on tablets/phones.
      interactive-widget=resizes-content: virtual keyboard shrinks the layout
      (Chromium) so terminal + statusbar stay visible while typing.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f1f1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PyIDE" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>PyIDE — Python Online IDE</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
